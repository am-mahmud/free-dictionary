<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Daisy UI & Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- CSS -->
    <link rel="stylesheet" href="./styles/style.css">
    <title>Free Dictionary</title>
</head>

<body class="bg-[#fdf7f1]">

    <section class="w-11/12 mx-auto flex flex-col ">

        <header>
            <div class="relative flex justify-center items-center">
                <img class="w-64 h-64" src="./assets/dictionary-boy.png" alt="Dictionary Boy">
                <h1
                    class="absolute inset-0 flex items-center justify-center text-5xl font-semibold epunda-slab-font text-center">
                    Free Dictionary
                </h1>
            </div>

            <nav>

                <hr class="text-gray-300">
                <div class="flex justify-between items-center list-none epunda-slab-font py-1">
                    <li class="text-center"> <span id="datetime"></span></li>
                    <li class="text-end">Support Educators</li>
                </div>
                <hr class="text-gray-300">
            </nav>

        </header>

        <main class="h-[56vh]">

            <section id="word-container" class="mt-10">

                <form class="max-w-md mx-auto">
                    <label for="default-search"
                        class="mb-2 text-sm font-medium text-gray-900 sr-only dark:text-white">Search</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                            <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
                            </svg>
                        </div>
                        <input type="search" id="default-search"
                            class="block w-full p-4 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-100 focus:ring-gray-500 focus:border-gray-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-red-500 dark:focus:border-red-500"
                            placeholder="Search Words" required />
                        <button type="submit"
                            class="text-white absolute end-2.5 bottom-2.5 bg-[#6f614c]  focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-800">Search</button>
                    </div>
                </form>


                <div id="word-details" class="max-w-md mx-auto mt-3">

                </div>

            </section>

        </main>

        <footer>
            <section class="flex justify-between">
                <div>
                    <p class="text-center epunda-slab-font">&copy; Free Dictionary 2025</p>
                </div>
                <div>
                    <p class="text-center epunda-slab-font">@as-if.dev</p>
                </div>

            </section>

        </footer>

    </section>

    <script src="./script/main.js"></script>
</body>

</html>
